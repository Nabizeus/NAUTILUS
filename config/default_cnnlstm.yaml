data:
  regions:
  - name: "Ross_Sea"
    x_range: [128, 167] #x_ange: [152, 157]
    y_range: [16, 48] #y_range: [33, 38]
    z_range: [900, 1000] # use idx:46 Ross Sea
    mix_layer: "¿¿¿ m"
  - name: "North_Atlantic"
    x_range: [239, 259] #x_range: [253, 258]
    y_range: [177, 207] #y_range: [148, 153]
    z_range: [600, 700] # Off the coast of northern Brazil IDX 37
    mix_layer: "¿¿¿ m"
  - name: "South_Pacific"
    x_range: [126, 206] #x_range: [181, 186]
    y_range: [64, 114] #y_range: [93, 98]
    z_range: [300, 400] #South Pacifi 4 patches idx=46
    mix_layer: "¿¿¿ m"  
  visualize_regions: true
  window: 
    input_steps: 24      # number of input time steps for the model (LSTM sequence len)
    pred_steps: 1  
  tracers:
    paths:
      - "/gpfs/scratch/bsc32/bsc032739/a95g/19710101/fc02/runtime/a95g_1ts_19710101_19711231_opa_grid_T_3D.nc"
    variables: ["mytrc"]
  neighbors:
    velocity_paths:
      - "/gpfs/scratch/bsc32/bsc032739/a95g/19710101/fc02/runtime/a95g_1ts_19710101_19711231_opa_grid_U_3D.nc"
      - "/gpfs/scratch/bsc32/bsc032739/a95g/19710101/fc02/runtime/a95g_1ts_19710101_19711231_opa_grid_V_3D.nc"
      - "/gpfs/scratch/bsc32/bsc032739/a95g/19710101/fc02/runtime/a95g_1ts_19710101_19711231_opa_grid_W_3D.nc"
    u_var: "umo"
    v_var: "vmo"
    w_var: "wmo"
  vertical_levels: 5
  coords:
    time: "time_counter"
    depth: "z"
    y: "y"
    x: "x"
  mask:
    path: null
    var: null
  lead_time: 1 # how many steps ahead to predict
  stride: 1 # how much to slide the window
  norm_stats_path: "artifacts/norm_stats.json"
  include_current_tracer: true
  norm:
    compute: true
    save_path: "runs/norm_stats.json"
  depth_stack: [-2, -1, 0, 1, 2] # [-3, -2, -1, 0, 1, 2, 3]relative to selected z_index
model:
  type: "cnnlstm"
  name: "C2L" #Conv2LSTM
  spatial_mode: "2d"
  in_channels: null
  hidden_channels: 64
  enc_channels: [64, 128]
  kernel_size: 3
  convlstm_layers: 1
  dropout: 0.1
  hidden_dim: 128
  depth_channels: 75
training:
  device: "cpu"
  seed: 42
  epochs: 20
  batch_size: 8
  num_workers: 0
  lr: 1e-4
  val_fraction: 0.1

  # logging & checkpointing
  log_dir: "./logs"
  checkpoint_dir: "./checkpoints"
  experiment_name: "ocean_transport_baseline"
  output_dir: "artifacts/"

  # resume training from checkpoint
  resume_from: ""  # or path to checkpoint if resuming

io:
  log_interval: 25
  save_every: 10
  predict_out: "runs/preds.nc"

debug:
  save_every_n_batches: 10
  save_first_k_batches: 200

